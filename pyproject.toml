[project]
name = "aiogram-screens"
version = "0.1.0"
description = "Declarative, frozen message screens for aiogram 3 bots"
authors = [
    {name = "DmitryDavis",email = "dmitrydavis@protonmail.com"},
]
dependencies = ["aiogram>=3.31.0,<4.0"]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["linters", "tests"]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["aiogram_screens"]
branch = true
# Coverage data from different CI jobs is combined in one place.
relative_files = true

[tool.coverage.report]
exclude_also = [
    "@overload",
    "@abc.abstractmethod",
    "if TYPE_CHECKING:",
]

[dependency-groups]
linters = [
    "mypy>=2.4.1",
    "black>=26.10.1",
    "isort>=9.0.2",
    "nox>=2026.10.20",
]
tests = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
