[project]
name = "aiogram-screens"
version = "0.1.0"
description = "Declarative, frozen message screens for aiogram 3 bots"
authors = [
    {name = "DmitryDavis",email = "dmitrydavis@protonmail.com"},
]
dependencies = ["aiogram>=3.31.0,<4.0"]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["linters", "tests"]

[tool.ruff]
# target-version is taken from requires-python.
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes: unused imports and names, undefined names
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade: syntax for the supported Python versions
    "B",     # flake8-bugbear: likely bugs and design problems
    "A",     # flake8-builtins: shadowed builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie: unnecessary code
    "PERF",  # perflint
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "T20",   # flake8-print
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "TID",   # flake8-tidy-imports
    "PGH",   # pygrep-hooks: blanket type: ignore and noqa
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# aiogram's Default("...") is an immutable marker for bot-wide defaults,
# meant to be used as an argument default (B008, RUF009).
extend-immutable-calls = ["aiogram.client.default.Default"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["aiogram_screens"]
branch = true
# Coverage data from different CI jobs is combined in one place.
relative_files = true

[tool.coverage.report]
exclude_also = [
    "@overload",
    "@abc.abstractmethod",
    "if TYPE_CHECKING:",
]

[dependency-groups]
linters = [
    "mypy>=2.4.1",
    "nox>=2026.10.20",
    "ruff>=0.17.5",
]
tests = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
